name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: odonto-clinics

jobs:
  test:
    name: Testes e tipos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:



      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    defaults:
      run:
        working-directory: odonto-clinics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: odonto-clinics/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: Checar tipos
        run: npx tsc --noEmit

      - name: Rodar testes
        run: npm test

  deploy:
    name: Deploy no Amplify
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Diagnóstico OIDC
        run: |
           TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
           PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
           while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
           echo "$PAYLOAD" | base64 -d | jq '{sub, aud, ref, repository}'

      - name: Autenticar na AWS (OIDC, sem chaves fixas)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Disparar build e publicar no Amplify
        env:
          APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          BRANCH: ${{ vars.AMPLIFY_BRANCH }}
        run: |
          JOB_ID=$(aws amplify start-job \
            --app-id "$APP_ID" \
            --branch-name "$BRANCH" \
            --job-type RELEASE \
            --query 'jobSummary.jobId' --output text)
          echo "Job do Amplify: $JOB_ID"

          for i in $(seq 1 90); do
            STATUS=$(aws amplify get-job \
              --app-id "$APP_ID" \
              --branch-name "$BRANCH" \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' --output text)
            echo "[$i] status: $STATUS"
            case "$STATUS" in
              SUCCEED) echo "Deploy concluído."; exit 0 ;;
              FAILED|CANCELLED) echo "Deploy falhou: $STATUS"; exit 1 ;;
            esac
            sleep 20
          done
          echo "Tempo esgotado aguardando o Amplify."
          exit 1